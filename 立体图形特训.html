<!-- 立体图形特训 · 单文件离线版：双击即可使用，无需服务器、无需联网 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FDF6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="立体图形特训">
<title>立体图形特训 · 行测空间推理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%23FDEFF3%22%2F%3E%0A%20%20%3Cg%20transform%3D%22translate(256%20268)%22%3E%0A%20%20%20%20%3Cpolygon%20points%3D%220%2C-120%20104%2C-60%20104%2C60%200%2C120%20-104%2C60%20-104%2C-60%22%20fill%3D%22%23FFF%22%20stroke%3D%22%23D95C83%22%20stroke-width%3D%2214%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%20%20%3Cpolygon%20points%3D%220%2C-120%20104%2C-60%200%2C0%20-104%2C-60%22%20fill%3D%22%23F4C0CE%22%20stroke%3D%22%23D95C83%22%20stroke-width%3D%2214%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%20%20%3Cpolygon%20points%3D%220%2C0%20104%2C-60%20104%2C60%200%2C120%22%20fill%3D%22%23FADCE4%22%20stroke%3D%22%23D95C83%22%20stroke-width%3D%2214%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<style>
/* ============================================================
 *  立体图形特训 · UI 主题
 *  风格：iOS 原生（大标题、卡片、圆角、无边框按钮）+ 淡粉色
 * ========================================================== */
:root{
  --pink-50:#FFF8FA;
  --pink-100:#FDEFF3;
  --pink-200:#FADCE4;
  --pink-300:#F4C0CE;
  --pink-400:#EE9DB4;
  --pink-500:#E57E9C;
  --pink-600:#D95C83;
  --pink-700:#B8466A;
  --ink:#3A2C33;
  --ink-2:#6E5A63;
  --ink-3:#A3909A;
  --line:#F0DDE4;
  --card:#FFFFFF;
  --bg:#FDF6F8;
  --ok:#4FB39B;
  --ok-bg:#E6F6F1;
  --bad:#EE7A8C;
  --bad-bg:#FDECEF;
  --warn:#E9A54C;
  --radius:18px;
  --radius-s:12px;
  --shadow:0 2px 10px rgba(200,150,170,.10), 0 10px 30px rgba(200,150,170,.07);
  --shadow-s:0 1px 4px rgba(200,150,170,.12);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
svg{display:block}
.fig{display:block;margin:0 auto}

/* ---------- 导航 ---------- */
.nav{position:sticky;top:0;z-index:40;background:rgba(253,246,248,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.nav-inner{max-width:720px;margin:0 auto;padding:14px 20px 10px}
.nav h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.nav-sub{font-size:13px;color:var(--ink-3);margin-top:2px}

#main{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b));}

/* ---------- TabBar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:var(--safe-b)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--ink-3);font-size:11px;font-weight:500;transition:color .18s}
.tab .ti{font-size:21px;line-height:1;filter:grayscale(.35);opacity:.75;transition:transform .2s}
.tab.active{color:var(--pink-600)}
.tab.active .ti{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:12px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title h3{font-size:16px}
.card-title .more{font-size:13px;color:var(--pink-600)}
.sec-title{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;margin:18px 4px 8px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.divider{height:.5px;background:var(--line);margin:12px 0}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;background:var(--pink-500);color:#fff;font-weight:600;font-size:15px;transition:transform .12s,opacity .12s;box-shadow:0 4px 14px rgba(229,126,156,.28)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--pink-100);color:var(--pink-700);box-shadow:none}
.btn.line{background:#fff;color:var(--pink-600);border:1px solid var(--pink-200);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}

/* ---------- 今日任务 ---------- */
.hero{background:linear-gradient(135deg,#FFF1F5 0%,#FDE7EE 55%,#F9D8E4 100%);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero h2{font-size:19px;margin-bottom:2px}
.hero p{font-size:12.5px;color:var(--ink-2)}
.hero-stats{display:flex;gap:14px;margin-top:14px;position:relative}
.hero-stat{flex:1;background:rgba(255,255,255,.72);border-radius:14px;padding:9px 10px;text-align:center}
.hero-stat b{display:block;font-size:19px;font-weight:700;color:var(--pink-700);line-height:1.2}
.hero-stat span{font-size:11px;color:var(--ink-3)}

/* 进度环 */
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.75)}
.ring .fg{stroke:var(--pink-500);transition:stroke-dashoffset .5s}
.ring-wrap{display:flex;align-items:center;gap:14px;margin-top:14px;position:relative}
.ring-wrap .txt{flex:1}
.ring-wrap .txt b{font-size:15px;display:block}
.ring-wrap .txt span{font-size:12px;color:var(--ink-2)}
.ring-num{font-size:11px;font-weight:700;fill:var(--pink-700)}

/* ---------- 题型网格 ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-card{background:#fff;border-radius:15px;padding:13px;box-shadow:var(--shadow-s);text-align:left;transition:transform .14s;border:1.5px solid transparent}
.type-card:active{transform:scale(.97)}
.type-card.on{border-color:var(--pink-300);background:var(--pink-50)}
.type-card .ico{font-size:22px;line-height:1}
.type-card b{display:block;font-size:14.5px;margin-top:6px}
.type-card .d{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.type-card .rate{margin-top:8px;height:4px;border-radius:3px;background:var(--pink-100);overflow:hidden}
.type-card .rate i{display:block;height:100%;background:var(--pink-400);border-radius:3px}
.type-card .rate-n{font-size:10.5px;color:var(--ink-3);margin-top:4px}

/* ---------- 答题 ---------- */
.sheet{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet-head{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;background:rgba(253,246,248,.94);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.sheet-head .q-progress{height:5px;background:var(--pink-100);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.sheet-head .q-bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink-400),var(--pink-600));border-radius:3px;transition:width .3s}
.sheet-head .q-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pink-100);color:var(--pink-700);font-size:14px;flex:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(76px + var(--safe-b));max-width:720px;width:100%;margin:0 auto}
.sheet-foot{padding:10px 16px calc(14px + var(--safe-b));background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.sheet-foot .inner{max-width:720px;margin:0 auto}

.q-stem{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.q-stem .qt{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.5}
.q-stem .figwrap{background:var(--pink-50);border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:100px}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--pink-100);color:var(--pink-700);font-weight:500}
.tag.g{background:var(--ok-bg);color:var(--ok)}
.tag.o{background:#FFF3E4;color:var(--warn)}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{background:#fff;border-radius:15px;padding:10px;box-shadow:var(--shadow-s);border:2px solid transparent;transition:transform .12s,border-color .2s;position:relative;overflow:hidden}
.opt:active{transform:scale(.98)}
.opt .lb{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:6px;background:var(--pink-100);color:var(--pink-700);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt .fig{margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right .lb{background:var(--ok);color:#fff}
.opt.wrong .lb{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}

.explain{background:#fff;border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-top:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.explain b{color:var(--ink)}
.explain .eh{font-size:14.5px;font-weight:700;color:var(--pink-700);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:7px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- 技巧 ---------- */
.m-card{background:#fff;border-radius:15px;box-shadow:var(--shadow-s);margin-bottom:10px;overflow:hidden}
.m-head{display:flex;align-items:center;gap:10px;padding:13px 14px}
.m-head .lv{width:26px;height:26px;border-radius:9px;background:var(--pink-100);color:var(--pink-700);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.m-head .t{flex:1;min-width:0}
.m-head .t b{font-size:15px;display:block}
.m-head .t span{font-size:11.5px;color:var(--ink-3)}
.m-head .ar{color:var(--ink-3);font-size:13px;transition:transform .25s}
.m-card.open .m-head .ar{transform:rotate(90deg)}
.m-body{padding:0 14px 14px;font-size:13.5px;color:var(--ink-2);line-height:1.72}
.m-body[hidden]{display:none}
.m-body h4{font-size:12.5px;color:var(--pink-700);margin:12px 0 5px;letter-spacing:.02em}
.m-body ol,.m-body ul{margin:0;padding-left:19px}
.m-body li{margin-bottom:5px}
.chant{background:var(--pink-50);border-left:3px solid var(--pink-300);border-radius:0 10px 10px 0;padding:9px 12px;font-size:13.5px;color:var(--pink-700);font-weight:600;margin:8px 0}
.trap{background:#FFF8EC;border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.5px;color:#8a6534;margin:8px 0}
.demo{background:var(--pink-50);border-radius:12px;padding:12px;text-align:center;margin:10px 0}

/* ---------- 图表 ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .n{width:74px;font-size:12.5px;color:var(--ink-2);flex:none;text-align:right}
.bar-row .bar{flex:1;height:9px;background:var(--pink-100);border-radius:5px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500))}
.bar-row .v{width:52px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.bar-row.weak .bar i{background:linear-gradient(90deg,#F5B0A0,var(--bad))}
.chart{width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--pink-50);border-radius:13px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:18px;color:var(--pink-700);font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--ink-3)}

/* ---------- 列表 ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:none}
.row .r-main{flex:1;min-width:0}
.row .r-main b{font-size:14.5px;display:block;font-weight:500}
.row .r-main span{font-size:12px;color:var(--ink-3)}
.row .r-side{font-size:12.5px;color:var(--ink-3);flex:none;text-align:right}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--pink-100);color:var(--pink-700);margin-right:5px}
.chip.b{background:var(--bad-bg);color:var(--bad)}
.chip.g{background:var(--ok-bg);color:var(--ok)}
.chip.w{background:#FFF3E4;color:var(--warn)}

.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:13.5px}
.empty .e-ico{font-size:40px;margin-bottom:10px;opacity:.55}

/* ---------- 实验室 ---------- */
.lab-stage{background:linear-gradient(160deg,#FFF9FB,#FCEFF4);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);margin-bottom:12px;position:relative}
.lab-stage canvas{width:100%;height:300px;display:block;touch-action:none;cursor:grab}
.lab-stage canvas:active{cursor:grabbing}
.lab-tip{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);background:rgba(255,255,255,.8);padding:3px 9px;border-radius:8px;pointer-events:none}
.seg{display:flex;background:var(--pink-100);border-radius:11px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;color:var(--ink-2);font-weight:500;transition:.18s}
.seg button.on{background:#fff;color:var(--pink-700);font-weight:600;box-shadow:var(--shadow-s)}
.slider-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.slider-row label{font-size:12.5px;color:var(--ink-2);width:66px;flex:none}
.slider-row input[type=range]{flex:1;accent-color:var(--pink-500);height:22px}
.slider-row .val{font-size:12px;color:var(--ink-3);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.net-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.net-item{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:var(--shadow-s);transition:transform .13s}
.net-item:active{transform:scale(.96)}
.net-item.on{border:2px solid var(--pink-400)}
.net-item .fig{margin:0 auto}
.net-item span{font-size:10px;color:var(--ink-3);display:block;margin-top:4px}
.vox-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vox-pick button{padding:8px 4px;border-radius:10px;background:#fff;box-shadow:var(--shadow-s);font-size:12px}
.vox-pick button.on{background:var(--pink-500);color:#fff}
.plane-btns{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(60,40,50,.32);backdrop-filter:blur(2px)}
.modal-box{position:relative;width:100%;max-width:640px;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px;border-bottom:.5px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:14px 16px calc(24px + var(--safe-b));overflow-y:auto}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(58,44,51,.93);color:#fff;padding:9px 18px;border-radius:20px;font-size:13.5px;z-index:300;animation:fade .25s;max-width:80%;text-align:center}
.toast[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ---------- 表单 ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--pink-300)}
.field textarea{min-height:72px;resize:vertical}
.field .row-in{display:flex;gap:8px}

/* ---------- 更新中心 ---------- */
.src-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line)}
.src-row:last-child{border-bottom:none}
.src-row .m{flex:1;min-width:0}
.src-row .m b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-row .m span{font-size:11.5px;color:var(--ink-3)}
.switch{width:44px;height:26px;border-radius:14px;background:var(--pink-200);position:relative;transition:.22s;flex:none}
.switch i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on{background:var(--pink-500)}
.switch.on i{left:21px}
.ver{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 动画 ---------- */
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:pop .32s cubic-bezier(.2,.9,.3,1) both}
@media (min-width:700px){
  .opts{grid-template-columns:repeat(4,1fr)}
}

/* ---------- 自适应补充 ---------- */
svg{max-width:100%;height:auto}
.opt svg,.q-stem .figwrap svg{max-height:180px;width:auto}
.opt{max-height:230px;display:flex;align-items:center;justify-content:center;padding-top:26px}
.opt .fig{margin:0}
.net-item svg{margin:0 auto}
#vBox svg{margin:0 auto}
.lab-stage svg{margin:0 auto}
@media (max-width:360px){
  .nav h1{font-size:22px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .opts{gap:8px}
}

</style>
</head>
<body>
<div id="app">
  <header class="nav" id="nav">
    <div class="nav-inner">
      <h1 id="navTitle">立体图形特训</h1>
      <div class="nav-sub" id="navSub">行测空间推理专项</div>
    </div>

      type: 'fold', diff,
      stem, options: final.map((x) => x.svg), answer,
      stemText: '左边给定的是纸盒的外表面展开图，右边哪一项能由它折叠而成？',
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 相对面排除：${oppNote}\n2. 相邻面定位：在展开图中找一个方向性强的面（如${patName(pats[vis[0]])}所在的${CN.faceLabel(vis[0])}面）画箭头，箭头上、下、左、右分别是哪个面，在立体图中必须完全一致。\n3. 逐项核对：\n${final.map((x, i) => `   ${'ABCD'[i]}：${x.right ? '一致，当选。' : x.note + '，排除。'}`).join('\n')}`,
      methods: ['relative', 'arrow', 'publicEdge'],
      tags: ['六面体', '折纸盒', CN.CLASSIC_LAYOUTS[lk].type]
    };
  }

  /* ============================================================
   *  题型二：拆纸盒（立体 -> 展开图）
   * ========================================================== */
  function genUnfold(rng, diff) {
    const layouts = Object.keys(CN.CLASSIC_LAYOUTS);
    let net = null, lk = null;
    for (let i = 0; i < 60 && !net; i++) {
      lk = pick(rng, layouts);
      net = CN.buildNetFromLayout(transformCells(CN.CLASSIC_LAYOUTS[lk].cells, rng));
    }
    if (!net) net = CN.buildNetFromLayout(CN.CLASSIC_LAYOUTS.net7.cells);
    const pats = assignPatterns(rng, diff);
    const cam = randomCam(rng);
    const vis = visibleFaces(cam);
    const stem = RD.cubeToSVG(pats, { cam, width: 180, height: 180 });

    const mkNet = (mut) => {
      const p = clone(pats); const extra = {};
      if (mut) {
        const a = pick(rng, vis);
        if (mut === 'swap') {
          const b = pick(rng, vis.filter((k) => k !== a));
          [p[a], p[b]] = [p[b], p[a]];
        } else if (mut === 'rotate') {
          extra[a + '_rot'] = 90;
        } else {
          p[a] = pats[CN.OPPOSITE[a]];
        }
      }
      const q = Object.assign({}, p, extra);
      return RD.netToSVG(net, q, { cell: 36 });
    };
    const right = mkNet(null);
    const wrongSet = [];
    for (const m of shuffle(rng, ['swap', 'rotate', 'opposite'])) {
      const s = mkNet(m);
      if (s !== right && !wrongSet.includes(s)) wrongSet.push(s);
    }
    const items = [{ svg: right, right: true }].concat(wrongSet.slice(0, 3).map((s) => ({ svg: s, right: false })));
    const final = shuffle(rng, items);
    const answer = final.findIndex((x) => x.right);
    return {
      type: 'unfold', diff,
      stem, options: final.map((x) => x.svg), answer,
      stemText: '左边给定的是纸盒的外表面（可见三个面），右边哪一项是它的展开图？',
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 先在立体图上定三个可见面的相对位置：${vis.map((k) => CN.faceLabel(k) + '面').join('、')}。\n2. 在展开图中定位这三个面，用"箭头法"：在${CN.faceLabel(vis[0])}面（${patName(pats[vis[0]])}）上画箭头，其左右上下的面必须与立体图一致。\n3. 相对面在展开图中呈"相间排列"或"Z 字型两端"，折成立体后不可能相邻，据此可先排除 1～2 项。\n4. 本题为${CN.CLASSIC_LAYOUTS[lk].name}，属于${CN.CLASSIC_LAYOUTS[lk].type}。`,
      methods: ['relative', 'arrow', 'publicPoint'],
      tags: ['六面体', '拆纸盒', CN.CLASSIC_LAYOUTS[lk].type]
    };
  }

  /* ============================================================
   *  体素（小立方体堆叠）生成：保证稳定、连通
   * ========================================================== */
  function genVoxels(rng, opt = {}) {
    const nx = opt.nx || 3, ny = opt.ny || 3, nz = opt.nz || (diff => 3)(opt.diff) || 3;
    const maxZ = opt.maxZ || (opt.diff === 'easy' ? 2 : 3);
    for (let attempt = 0; attempt < 80; attempt++) {
      // 底层
      const baseCount = 3 + Math.floor(rng() * (nx * ny - 2));
      const all = [];
      for (let x = 0; x < nx; x++) for (let y = 0; y < ny; y++) all.push([x, y]);
      const base = shuffle(rng, all).slice(0, baseCount);
      // 保证底层连通
      if (!connectedXY(base)) continue;
      const cells = base.map(([x, y]) => [x, y, 0]);
      for (let z = 1; z < maxZ; z++) {
        for (const [x, y] of all) {
          if (!cells.some((c) => c[0] === x && c[1] === y && c[2] === z - 1)) continue;
          if (rng() < 0.45) cells.push([x, y, z]);
        }
      }
      if (cells.length < 4) continue;
      if (cells.length > (opt.max || 16)) continue;
      return cells;
    }
    return [[0, 0, 0], [1, 0, 0], [0, 1, 0], [1, 1, 0], [1, 1, 1]];
  }
  function connectedXY(cells) {
    if (!cells.length) return false;
    const s = new Set(cells.map((c) => c[0] + ',' + c[1]));
    const seen = new Set([cells[0][0] + ',' + cells[0][1]]);
    const st = [cells[0]];
    while (st.length) {
      const [x, y] = st.pop();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (x + dx) + ',' + (y + dy);
        if (s.has(k) && !seen.has(k)) { seen.add(k); st.push([x + dx, y + dy]); }
      }
    }
    return seen.size === cells.length;
  }
  const voxKey = (cells) => cells.map((c) => c.join(',')).sort().join('|');

  /** 体素随机形变（用于补齐干扰项，保证与正解不同） */
  function mutateVox(cells, rng) {
    const c2 = clone(cells);
    const m = rng();
    if (m < 0.38 && c2.length > 3) {
      c2.splice(Math.floor(rng() * c2.length), 1);
    } else if (m < 0.72) {
      const b = c2[Math.floor(rng() * c2.length)];
      c2.push([b[0], b[1], b[2] + 1]);
    } else {
      const b = c2[Math.floor(rng() * c2.length)];
      c2.push([b[0] + (rng() < 0.5 ? 1 : -1), b[1], b[2]]);
    }
    if (voxKey(c2) === voxKey(cells)) return null;
    return c2;
  }
  /** 归一化体素坐标（平移到非负） */
  function normVox(cells) {
    let mx = Infinity, my = Infinity, mz = Infinity;
    for (const c of cells) { mx = Math.min(mx, c[0]); my = Math.min(my, c[1]); mz = Math.min(mz, c[2]); }
    return cells.map(([x, y, z]) => [x - mx, y - my, z - mz]);
  }
  function rotateVox(cells, axis, times) {
    let out = clone(cells);
    for (let t = 0; t < times; t++) {
      out = out.map(([x, y, z]) => {
        if (axis === 'z') return [-y, x, z];
        if (axis === 'y') return [z, y, -x];
        return [x, -z, y];
      });
    }
    let mx = Infinity, my = Infinity, mz = Infinity;
    for (const c of out) { mx = Math.min(mx, c[0]); my = Math.min(my, c[1]); mz = Math.min(mz, c[2]); }
    return out.map(([x, y, z]) => [x - mx, y - my, z - mz]);
  }

  /* ============================================================
   *  题型三：三视图 / 视图判断
   * ========================================================== */
  function genView(rng, diff) {
    const cells = genVoxels(rng, { diff, max: diff === 'easy' ? 8 : 14 });
    const cam = new Camera({ yaw: -Math.PI * 0.75, pitch: 0.62 });
    const stem = RD.voxelsToSVG(cells, { cam, width: 200, height: 200 });
    const views = ['front', 'top', 'left', 'right', 'back'];
    const target = pick(rng, views);
    const correct = RD.viewCellsSVG(cells, target, { cell: 26 });
    const ckey = RD.viewCells(cells, target).map((c) => c.join(',')).sort().join('|');

    const wrongs = [];
    // 干扰 1：其他视图（形状不同者）
    for (const v of shuffle(rng, views.filter((x) => x !== target))) {
      const k = RD.viewCells(cells, v).map((c) => c.join(',')).sort().join('|');
      if (k !== ckey) wrongs.push({ svg: RD.viewCellsSVG(cells, v, { cell: 26 }), why: `这是${RD.VIEW_CN[v]}，不是题目要求的${RD.VIEW_CN[target]}` });
      if (wrongs.length >= 2) break;
    }
    // 干扰 2：增删一格；不足时用随机形变补齐
    let cnt = 0;
    while (wrongs.length < 3 && cnt++ < 120) {
      const c2 = mutateVox(cells, rng);
      if (!c2) continue;
      const k = RD.viewCells(c2, target).map((c) => c.join(',')).sort().join('|');
      if (k === ckey) continue;
      const svg = RD.viewCellsSVG(c2, target, { cell: 26 });
      if (wrongs.some((w) => w.svg === svg)) continue;
      wrongs.push({ svg, why: '轮廓与题干立体的投影不符' });
    }
    const items = [{ svg: correct, right: true }].concat(wrongs.slice(0, 3).map((w) => ({ svg: w.svg, right: false, note: w.why })));
    const seen = new Set(); const uniq = [];
    for (const it of items) if (!seen.has(it.svg)) { seen.add(it.svg); uniq.push(it); }
    const final = shuffle(rng, uniq.slice(0, 4));
    const answer = final.findIndex((x) => x.right);
    const dirWord = { front: '从前向后（主视图）', back: '从后向前（后视图）', top: '从上向下（俯视图）', left: '从左向右（左视图）', right: '从右向左（右视图）' }[target];
    return {
      type: 'view3', diff, stem, options: final.map((x) => x.svg), answer,
      stemText: `左边给定的是由若干小正方体组成的多面体，${dirWord}观察，得到的视图是？`,
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 三视图一定是"平面图"，选项中出现立体感的（如能看到顶面）直接排除。\n2. 原图有线才有线，原图没线就没线：把立体按${dirWord}压扁，每个位置只要有一个小方块就算一格。\n3. 被挡住的部分看不见——同一投影位置上有多个方块时，只算一格。\n4. 本题该方向投影共 ${RD.viewCells(cells, target).length} 个小方格，据此可先排除格数不符的选项。`,
      methods: ['view', 'occlusion'],
      tags: ['三视图', dirWord]
    };
  }

  /* ============================================================
   *  题型四：截面图（一刀切）
   * ========================================================== */
  const PLANES = [
    { name: '水平切', p: [1.5, 1.5, 1], n: [0, 0, 1] },
    { name: '竖直切', p: [1.5, 1.5, 1], n: [0, 1, 0] },
    { name: '侧向切', p: [1.5, 1.5, 1], n: [1, 0, 0] },
    { name: '斜 45°切', p: [1.5, 1.5, 1], n: [1, 0, 1] },
    { name: '斜 45°切（反向）', p: [1.5, 1.5, 1], n: [1, 0, -1] },
    { name: '对角切', p: [1.5, 1.5, 1], n: [1, 1, 0] },
    { name: '对角切（反向）', p: [1.5, 1.5, 1], n: [1, -1, 0] },
    { name: '斜切（三向）', p: [1.5, 1.5, 1], n: [1, 1, 1] }
  ];
  function genSection(rng, diff) {
    const cells = genVoxels(rng, { diff, nx: 3, ny: 3, maxZ: diff === 'easy' ? 2 : 3, max: 12 });
    const cam = new Camera({ yaw: -Math.PI * 0.75, pitch: 0.62 });
    const stem = RD.voxelsToSVG(cells, { cam, width: 200, height: 200 });

    // 生成若干真实截面（互不相同的形状）
    const reals = [];
    for (const pl of shuffle(rng, PLANES)) {
      const p = { p: [1.5, 1.5, pl.p[2]], n: pl.n };
      // 让平面穿过立体：把平面点投影到立体重心方向
      const cen = cells.reduce((a, c) => [a[0] + c[0] + 0.5, a[1] + c[1] + 0.5, a[2] + c[2] + 0.5], [0, 0, 0]).map((x) => x / cells.length);
      const pn = V.norm(pl.n);
      const pp = V.add(cen, V.mul(pn, 0.0));
      const sec = RD.sectionOf(cells, { p: pp, n: pn }, { step: 0.06 });
      const r = RD.sectionToSVG(sec, { scale: 30 });
      if (r.svg && r.comps === 1 && r.area > 0.2) {
        const sig = r.pathD.length + '|' + r.area.toFixed(2);
        if (!reals.some((x) => x.sig === sig)) reals.push({ ...r, sig, plane: pl.name });
      }
      if (reals.length >= 3) break;
    }
    if (reals.length < 1) return null;

    // 干扰项：绝对截不出的形状
    const fake = (() => {
      // 两块分离（一刀切对单连通立体只会得到一个连通面）
      const g = [[0, 0], [1, 0], [3, 0], [4, 0], [0, 1], [1, 1], [3, 1], [4, 1]];
      return RD.gridToSVG(g, { cell: 22 });
    })();
    const items = reals.slice(0, 3).map((r) => ({ svg: r.svg, right: false }));
    const pickTrue = rng() < 0.5; // 一半出"可能"、一半出"不可能"
    let final, answer, q;
    if (pickTrue && reals.length >= 1) {
      // 问"可能是截面"：1 真 + 3 假
      const falses = [fake,
      RD.gridToSVG([[0, 0], [1, 0], [2, 0], [0, 1], [0, 2]], { cell: 22 }),   // 直角三角形
      RD.gridToSVG([[0, 0], [1, 0], [2, 0], [3, 0], [4, 0], [0, 1], [0, 2], [0, 3]], { cell: 22 })]; // L 形长条
      final = shuffle(rng, [{ svg: reals[0].svg, right: true }].concat(falses.slice(0, 3).map((s) => ({ svg: s, right: false }))));
      q = '以下哪一项可能是该多面体的截面？';
    } else {
      final = shuffle(rng, items.concat([{ svg: fake, right: true }]));
      q = '以下哪一项不可能是该多面体的截面？';
    }
    answer = final.findIndex((x) => x.right);
    return {
      type: 'section', diff, stem, options: final.map((x) => x.svg), answer,
      stemText: `左边给定的是一个多面体，将其从任一面剖开（一刀切），${q}`,
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 一刀切原则：一个平面切下去，截面必然是**一个连通的**平面图形，切不出分离的两块。\n2. 由小正方体组成的多面体，截面一定是**直线段围成的多边形**，绝不会出现曲线。\n3. 正方体截面最多六边形；切出的三角形一定是锐角三角形（不可能是直角或钝角三角形）。\n4. 镂空/凹陷处，截面会相应出现缺口，要分层核对。`,
      methods: ['section', 'onecut'],
      tags: ['截面图', '一刀切']
    };
  }

  /* ============================================================
   *  题型五：堆积与拼合（俯视图数字 -> 立体）
   * ========================================================== */
  function genStack(rng, diff) {
    const cells = genVoxels(rng, { diff, max: diff === 'easy' ? 8 : 13 });
    const cam = new Camera({ yaw: -Math.PI * 0.75, pitch: 0.62 });
    // 俯视图数字
    const height = new Map();
    for (const [x, y, z] of cells) height.set(x + ',' + y, Math.max(height.get(x + ',' + y) || 0, z + 1));
    const grid = [], nums = [];
    for (const [k, v] of height) { const [x, y] = k.split(',').map(Number); grid.push([x, y]); nums.push([x, y, v]); }
    const stem = topNumberSVG(nums);
    const correct = RD.voxelsToSVG(cells, { cam, width: 190, height: 190 });
    const ckey = voxKey(cells);

    const wrongs = [];
    let guard = 0;
    while (wrongs.length < 3 && guard++ < 120) {
      const c2 = mutateVox(cells, rng);
      if (!c2) continue;
      const svg = RD.voxelsToSVG(c2, { cam, width: 190, height: 190 });
      if (svg === correct || wrongs.some((w) => w.svg === svg)) continue;
      wrongs.push({ svg, note: c2.length > cells.length ? '多了一个方块' : '少了一个方块' });
    }
    const final = shuffle(rng, [{ svg: correct, right: true }].concat(wrongs.slice(0, 3)));
    const answer = final.findIndex((x) => x.right);
    const total = cells.length;
    return {
      type: 'stack', diff, stem, options: final.map((x) => x.svg), answer,
      stemText: '下图是该多面体的俯视图，方格中的数字表示该位置叠放的小正方体个数，该多面体是？',
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 先数总数：把俯视图各格数字相加 = ${total} 个小正方体，先排除总数不符的选项（最快）。\n2. 再定最高点：最大的数字是 ${Math.max(...nums.map((n) => n[2]))}，对应位置必须有这么高的一摞。\n3. 分层核对：从最上层往下看，逐层确认凸起的位置与数字分布一致。\n4. 凹凸一致原则：有凸必有凹，拼合时优先看特殊块（最高的一摞、孤立的一摞）。`,
      methods: ['stack', 'count', 'concave'],
      tags: ['堆积拼合', '俯视图']
    };
  }
  function topNumberSVG(nums) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of nums) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    const cell = 40, W = (maxX - minX + 1) * cell + 10, H = (maxY - minY + 1) * cell + 10;
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fig">`];
    const map = new Map(nums.map((n) => [n[0] + ',' + n[1], n[2]]));
    for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) {
      const px = 5 + (x - minX) * cell, py = 5 + (y - minY) * cell;
      const v = map.get(x + ',' + y);
      out.push(`<rect x="${px}" y="${py}" width="${cell}" height="${cell}" fill="#fffafb" stroke="#5b4750" stroke-width="1.3"/>`);
      if (v) out.push(`<text x="${px + cell / 2}" y="${py + cell / 2 + 6}" font-size="18" font-weight="600" fill="#3d2f36" text-anchor="middle">${v}</text>`);
    }
    out.push('</svg>');
    return out.join('');
  }

  /* ============================================================
   *  题型六：空间旋转
   * ========================================================== */
  function genRotate(rng, diff) {
    const cells = genVoxels(rng, { diff, max: diff === 'easy' ? 7 : 11, maxZ: diff === 'easy' ? 2 : 3 });
    const cam = new Camera({ yaw: -Math.PI * 0.75, pitch: 0.62 });
    const stem = RD.voxelsToSVG(cells, { cam, width: 190, height: 190 });
    const axis = pick(rng, ['z', 'y', 'x']);
    const dir = rng() < 0.5 ? 1 : 3; // 顺时针 / 逆时针
    const rightCells = rotateVox(cells, axis, dir);
    const rightSvg = RD.voxelsToSVG(rightCells, { cam, width: 190, height: 190 });
    const axisCn = { z: '竖直轴', y: '前后轴', x: '左右轴' }[axis];
    const dirCn = dir === 1 ? '顺时针' : '逆时针';

    const wrongs = [];
    const mirror = normVox(cells.map(([x, y, z]) => [-x, y, z]));
    const cands = [mirror, rotateVox(cells, axis, dir === 1 ? 2 : 2), rotateVox(cells, axis, dir === 1 ? 3 : 1), rotateVox(cells, axis, 2)];
    for (const c2 of cands) {
      const svg = RD.voxelsToSVG(c2, { cam, width: 190, height: 190 });
      if (svg !== rightSvg && !wrongs.includes(svg)) wrongs.push(svg);
    }
    let guard = 0;
    while (wrongs.length < 3 && guard++ < 100) {
      const c2 = mutateVox(cells, rng);
      if (!c2) continue;
      const svg = RD.voxelsToSVG(normVox(c2), { cam, width: 190, height: 190 });
      if (svg === rightSvg || wrongs.includes(svg)) continue;
      wrongs.push(svg);
    }
    const final = shuffle(rng, [{ svg: rightSvg, right: true }].concat(wrongs.slice(0, 3).map((s) => ({ svg: s, right: false }))));
    const answer = final.findIndex((x) => x.right);
    return {
      type: 'rotate', diff, stem, options: final.map((x) => x.svg), answer,
      stemText: `将左边的多面体绕${axisCn}${dirCn}旋转 90° 后，得到的图形是？`,
      explain: `【正确答案】${'ABCD'[answer]}\n\n【秒杀思路】\n1. 抓特征块：先找立体中最"特别"的一块（最高的一摞、最孤立的凸起、拐角），盯住它转，别整块硬想。\n2. 旋转不改变：方块总数（${cells.length} 个）、各块的相对位置与连接关系。\n3. 旋转会改变：朝向。左右镜像不能由旋转得到——若某选项与题干成镜像关系，直接排除。\n4. 用"分层法"：先看最上层转到了哪，再看下层。`,
      methods: ['rotate', 'feature'],
      tags: ['空间旋转', axisCn]
    };
  }

  /* ============================================================
   *  统一入口
   * ========================================================== */
  const GENS = { fold: genFold, unfold: genUnfold, view3: genView, section: genSection, stack: genStack, rotate: genRotate };

    const layouts = CN.CLASSIC_LAYOUTS;

    let patterns = randomPatterns();
    let t = 0, raf = null, playing = false;

    function randomPatterns() {
      const rng = QS.mulberry32(Date.now() & 0xffff);
      const dir = QS.mulberry32(Date.now() & 0xffff);
      const ids = PT.DIRECTIONAL.filter((x) => x !== 'blank');
      const sym = PT.IDS.filter((x) => PT.P[x].symmetric && x !== 'blank');
      const arr = [];
      for (let i = 0; i < 4; i++) arr.push(ids[Math.floor(rng() * ids.length)]);
      for (let i = 0; i < 2; i++) arr.push(sym[Math.floor(dir() * sym.length)]);
      // 去重
      const out = {};
      const keys = CN.FACE_KEYS;
      keys.forEach((k, i) => { out[k] = arr[i % arr.length]; });
      const used = new Set();
      for (const k of keys) {
        if (used.has(out[k])) { const rest = PT.IDS.filter((p) => !used.has(p) && p !== 'blank'); out[k] = rest[Math.floor(rng() * rest.length)] || 'circle'; }
        used.add(out[k]);

      const c0 = f0.reduce((a, f) => V.add(a, f.center), [0, 0, 0]).map((x) => -x / f0.length);
      const off1 = CN.cubeCenterOffset(net, 1);

    function renderViews(cells) {

  function trendSVG(tr) {
    const W = 300, H = 110, pad = 6;
    const maxN = Math.max(1, ...tr.map((x) => x.n));
    const bw = (W - pad * 2) / tr.length;
    let bars = '', line = [];
    tr.forEach((x, i) => {
      const hgt = (x.n / maxN) * (H - 34);
      bars += `<rect x="${(pad + i * bw + bw * 0.18).toFixed(1)}" y="${(H - 18 - hgt).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(0, hgt).toFixed(1)}" rx="2.5" fill="${x.n ? '#F4C0CE' : '#F7E7EC'}"/>`;
      if (x.rate != null) line.push([pad + i * bw + bw / 2, H - 18 - x.rate * (H - 34)]);
    });
    const pl = line.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const dots = line.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#D95C83"/>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}
      <path d="${pl}" fill="none" stroke="#D95C83" stroke-width="1.8" stroke-linejoin="round"/>${dots}
      <text x="${pad}" y="${H - 4}" font-size="9" fill="#A3909A">${tr[0].date}</text>
      <text x="${W - pad}" y="${H - 4}" font-size="9" fill="#A3909A" text-anchor="end">${tr[tr.length - 1].date}</text></svg>
      <p class="hint">柱：每日题量　线：当日正确率</p>`;
  }
  function srcListHTML() {
    const s = ST.load();
    if (!s.sources.length) return '<p class="hint">还没有订阅源。添加一个返回 JSON 题包的地址，即可自动同步最新题目。</p>';
    return s.sources.map((x) => `<div class="src-row">
      <div class="m"><b>${esc(x.name)}</b><span>${esc(x.url)} · 已同步 ${x.count || 0} 题 · ${x.lastSync ? new Date(x.lastSync).toLocaleString('zh-CN') : '未同步'}</span></div>

  let timerH = null;

      const s = Math.floor((Date.now() - t0) / 1000);
      el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  function choose(i, q) {
    if (quiz.answered) return;
    quiz.answered = true;
    clearInterval(timerH);
    const ms = Date.now() - quiz.perT;
    const ok = i === q.answer;
    const res = ST.record(q, i, ms);
    $$('#optBox .opt').forEach((b, j) => {
      if (j === q.answer) b.classList.add('right');
      else if (j === i) b.classList.add('wrong');

  function buildSet(kind, param) {
    const custom = ST.customByType();
    if (kind === 'quick') return QS.makeSet(TYPES, 20, (Math.random() * 1e6) | 0, null);
    if (kind === 'assess') return QS.makeSet(TYPES, 12, 9001, 'normal');
    if (kind === 'daily') {
      const day = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      return QS.makeSet(TYPES, 30, +day % 100000, null);
    }
    if (kind === 'type') return QS.makeSet([param], 20, (Math.random() * 1e6) | 0, null);
    if (kind === 'method') {
      const m = MT.byId[param];
      const ts = m.types.length ? m.types : TYPES;
      return QS.makeSet(ts, 15, (Math.random() * 1e6) | 0, null);
    }
    if (kind === 'path') {
      const p = MT.PATHS.find((x) => x.id === param);
      return QS.makeSet(p.types, 18, (Math.random() * 1e6) | 0, null);
    }
    if (kind === 'review') {
      const q = ST.reviewQueue(20).map((w) => getQ(w.qid)).filter(Boolean);
      return q;
    }
    if (kind === 'reviewall') {
      return ST.wrongList().filter((w) => !w.mastered).map((w) => getQ(w.qid)).filter(Boolean).slice(0, 40);
    }
    if (kind === 'custom') return custom;
    return QS.makeSet(TYPES, 20, 1, null);
  }

  async function syncSources(quiet) {
    const s = ST.load();
    const list = s.sources.filter((x) => x.enabled);
    if (!list.length) { if (!quiet) toast('没有启用的订阅源'); return 0; }
    let total = 0;
    for (const src of list) {
      try {
        const r = await fetch(src.url, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const qs = Array.isArray(data) ? data : (data.questions || []);
        const n = ST.addCustom(qs, src.name);
        ST.markSource(src.url, n);
        total += n;
      } catch (e) {
        if (!quiet) toast('同步失败：' + src.name + ' · ' + e.message);
      }
    }
    if (total && !quiet) toast('同步完成，新增 ' + total + ' 题');
    else if (!total && !quiet) toast('没有新增题目');
    if (total) refresh();
    return total;
  }

    });
    $$('#main [data-src]').forEach((sw) => {
      sw.onclick = () => {
        const s = ST.load();
        const x = s.sources.find((y) => y.url === sw.dataset.src);
        if (x) { x.enabled = !x.enabled; ST.save(); sw.classList.toggle('on', x.enabled); }
      };
    });
    const g = $('#setGoal');
    if (g) g.onchange = () => { const s = ST.load(); s.settings.dailyGoal = Math.max(5, Math.min(200, +g.value || 20)); ST.save(); refresh(); };
    // 实验室切换
    const seg = $('#labSeg');
    if (seg) $$('button', seg).forEach((b) => b.onclick = () => {
      $$('button', seg).forEach((x) => x.classList.remove('on'));
      b.classList.add('on'); mountLab(b.dataset.l);
    });
  }

  function openMethod(id) {
    const m = MT.byId[id];
    if (!m) return;
    modal(m.name, `<div class="hint" style="font-size:13.5px;line-height:1.8">
      <b>什么时候用：</b>${esc(m.when)}<br><br>
      <b>步骤：</b><br>${m.steps.map((x, i) => (i + 1) + '. ' + x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')).join('<br>')}<br><br>
      <div class="chant">${esc(m.chant)}</div>
      <div class="trap"><b>易错：</b>${esc(m.trap)}</div></div>
      <div class="btn-row" style="margin-top:12px"><button class="btn block" data-act="mdrill" data-m="${m.id}">练这个方法的题</button></div>`);
  }
  function openEntry() {
    optCount = 4; optImgs = [null, null, null, null]; stemImg = null;
    modal('录入新题', entryForm(), (box) => {
      renderEntryOpts($('#efOpts'));
      $('#efStemImg').onchange = () => {
        const r = new FileReader();
        r.onload = () => { stemImg = r.result; toast('题干图片已就绪'); };
        r.readAsDataURL($('#efStemImg').files[0]);
      };
      $('#efAdd').onclick = () => { if (optCount < 6) { optCount++; renderEntryOpts($('#efOpts')); } };
      $('#efSave').onclick = () => saveEntry(box);
    });
  }
  function openImport() {
    modal('导入 JSON 题包', `<p class="hint" style="margin-bottom:10px">题包格式：<code>[{"type":"fold","stemText":"...","options":["&lt;svg&gt;..",".."],"answer":1,"explain":"...","methods":["arrow"]}]</code><br>也可直接粘贴 <code>{"questions":[...]}</code>。</p>
      <div class="field"><textarea id="ijT" style="min-height:180px" placeholder='[{"type":"fold","stemText":"题干","options":["A图svg","B图svg","C图svg","D图svg"],"answer":2,"explain":"解析"}]'></textarea></div>
      <button class="btn block" id="ijGo">导入</button>
      <div class="field" style="margin-top:12px"><label>或上传 .json 文件</label><input type="file" id="ijF" accept=".json,application/json"></div>`,
      () => {
        $('#ijGo').onclick = () => {
          try { const n = ST.addCustom(JSON.parse($('#ijT').value), '导入题包'); toast('导入 ' + n + ' 题'); closeModal(); refresh(); }
          catch (e) { toast('格式错误：' + e.message); }
        };
        $('#ijF').onchange = () => {
          const r = new FileReader();
          r.onload = () => { try { const n = ST.addCustom(JSON.parse(r.result), '导入题包'); toast('导入 ' + n + ' 题'); closeModal(); refresh(); } catch (e) { toast('格式错误'); } };
          r.readAsText($('#ijF').files[0]);
        };
      });
  }
  function openSrc() {
    modal('添加题库订阅源', `<div class="field"><label>名称</label><input id="sfN" placeholder="如：我的真题库"></div>
      <div class="field"><label>JSON 地址</label><input id="sfU" placeholder="https://.../questions.json"></div>
      <p class="hint">返回内容需为题目数组或含 questions 字段的对象。开启"自动同步"后，每次启动会自动拉取新题并去重录入。</p>
      <button class="btn block" id="sfGo" style="margin-top:12px">添加并同步</button>`, () => {
      $('#sfGo').onclick = async () => {
        const u = $('#sfU').value.trim();
        if (!u) return toast('请填写地址');
        ST.addSource(u, $('#sfN').value.trim() || u);
        closeModal(); refresh();
        syncSources(false);
      };
    });
  }
  function exportData() {
    const blob = new Blob([ST.exportAll()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '立体图形特训-备份-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    toast('已导出');
  }
  function openImportBackup() {
    modal('导入备份', `<div class="field"><textarea id="ibT" style="min-height:160px" placeholder="粘贴此前导出的 JSON"></textarea></div>
      <button class="btn block" id="ibGo">导入并覆盖</button>`, () => {
      $('#ibGo').onclick = () => {
        try { ST.importAll($('#ibT').value); toast('已导入'); closeModal(); refresh(); }
        catch (e) { toast('格式错误'); }
      };
    });
  }
  function confirmReset() {
    modal('确认清空', `<p class="hint">将删除全部答题记录、错题本、自定义题目与设置，且不可恢复。</p>
      <div class="btn-row" style="margin-top:14px"><button class="btn ghost" data-close>取消</button><button class="btn" id="rsGo" style="background:var(--bad)">确认清空</button></div>`,
      () => { $('#rsGo').onclick = () => { ST.reset(); closeModal(); refresh(); toast('已清空'); }; });
  }

  /* ---------------- 全局事件 ---------------- */
  $$('#tabbar .tab').forEach((t) => {
    t.onclick = () => {
      if (!$('#quizSheet').hidden) { closeQuiz(); }
      if (labCtrl && labCtrl.destroy) { labCtrl.destroy(); labCtrl = null; }
      $$('#tabbar .tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      cur = t.dataset.tab;
      $('#main').scrollTop = 0;
      window.scrollTo({ top: 0 });
      refresh();
    };
  });
  $('#quizClose').onclick = closeQuiz;
  function closeQuiz() {
    $('#quizSheet').hidden = true;
    clearInterval(timerH);
    quiz = null;
    refresh();
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !b.closest('#modal')) return;
    if (b.dataset.act === 'mdrill') { closeModal(); start('method', b.dataset.m, (MT.byId[b.dataset.m] || {}).name + '专项'); }
  });
  window.addEventListener('resize', () => { if (labCtrl && labCtrl.resize) labCtrl.resize(); });

  /* ---------------- 启动 ---------------- */
  function boot() {
    refresh();
    const s = ST.load();
    if (s.settings.autoSync && s.sources.length) setTimeout(() => syncSources(true), 1200);
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  }
  boot();
})();

;
</script>
</body>
</html>
